<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      (function () {
        // ── Disable right-click ──────────────────────────────────
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

        // ── Block DevTools keyboard shortcuts ────────────────────
        document.addEventListener('keydown', function (e) {
          var key = e.key || '';
          // F12
          if (e.keyCode === 123) { e.preventDefault(); return false; }
          // Ctrl+Shift+I / J / C / K / E (inspector, console, element picker)
          if (e.ctrlKey && e.shiftKey && ['i','I','j','J','c','C','k','K','e','E'].includes(key)) {
            e.preventDefault(); return false;
          }
          // Ctrl+U (view source)
          if (e.ctrlKey && (key === 'u' || key === 'U')) { e.preventDefault(); return false; }
          // Ctrl+S (save page)
          if (e.ctrlKey && (key === 's' || key === 'S')) { e.preventDefault(); return false; }
          // Ctrl+P (print / source)
          if (e.ctrlKey && (key === 'p' || key === 'P')) { e.preventDefault(); return false; }
          // Alt+F4 style — no-op but catch Cmd+Option+I on Mac
          if (e.metaKey && e.altKey && (key === 'i' || key === 'I')) { e.preventDefault(); return false; }
        });

        // ── DevTools detection & lockout ────────────────────────
        var overlay = document.createElement('div');
        overlay.id = '__devblock';
        overlay.style.cssText = [
          'display:none;position:fixed;inset:0;z-index:2147483647;',
          'background:#000;color:#fff;',
          'flex-direction:column;align-items:center;justify-content:center;',
          'font-family:system-ui,sans-serif;text-align:center;'
        ].join('');
        overlay.innerHTML = '<div style="font-size:48px">🔒</div>' +
          '<div style="font-size:22px;font-weight:700;margin-top:16px">Access Denied</div>' +
          '<div style="font-size:14px;opacity:0.6;margin-top:8px">Developer tools are not permitted on this site.<br>Please close them to continue.</div>';

        var devOpen = false;

        function show() {
          if (!devOpen) {
            devOpen = true;
            document.body.appendChild(overlay);
            overlay.style.display = 'flex';
          }
        }
        function hide() {
          if (devOpen) {
            devOpen = false;
            overlay.style.display = 'none';
          }
        }

        // Method 1: window size diff (works for docked devtools)
        // Only run outside Replit iframe to avoid false positives
        var notInIframe = (function () { try { return window.self === window.top; } catch(e) { return false; } })();
        if (notInIframe) {
          setInterval(function () {
            var widthDiff = window.outerWidth - window.innerWidth > 160;
            var heightDiff = window.outerHeight - window.innerHeight > 160;
            if (widthDiff || heightDiff) show(); else hide();
          }, 600);
        }

        // Method 2: console object getter trick (undocked / detached devtools)
        var devImg = new Image();
        Object.defineProperty(devImg, 'id', {
          get: function () {
            show();
          }
        });
        setInterval(function () {
          console.log('%c ', devImg);
          console.clear();
        }, 1000);

        // Disable text selection to make copy-pasting source harder
        document.addEventListener('selectstart', function (e) {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
          }
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
